<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadraticPlayGround - Dragon Ball Edition</title>
  
  <!-- Pustaka Chart.js dan Plugin Zoom Resmi -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    :root {
      --primary: #f97316;
      --accent: #facc15;
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.94);
      --border: #ea580c;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top center, #7c2d12 0%, #1e1b4b 45%, #030712 100%);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
    }

    @media (max-width: 880px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(234, 88, 12, 0.35);
      position: relative;
    }

    .header-area {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .dragon-ball-icon {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #fde047 25%, #ea580c 100%);
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #b91c1c;
      font-weight: 900;
      box-shadow: 0 0 12px #f97316;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #9a3412;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      color: var(--accent);
      font-size: 1.25rem;
      text-shadow: 1px 1px 0 #9a3412;
    }

    .btn-reset-zoom {
      background: #ea580c;
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-reset-zoom:hover {
      background: #f97316;
      box-shadow: 0 0 10px var(--accent);
    }

    .equation-display {
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      padding: 14px;
      background: rgba(234, 88, 12, 0.15);
      border: 2px solid var(--accent);
      border-radius: 10px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.7);
      margin-bottom: 20px;
    }

    .control-row {
      margin-bottom: 16px;
      background: rgba(3, 7, 18, 0.75);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
    }

    .input-num {
      width: 85px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 2px solid var(--primary);
      background: #0f172a;
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
    }

    .input-num:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .result-section {
      margin-top: 20px;
      border-top: 2px solid var(--border);
      padding-top: 16px;
    }

    .stat-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .badge-two { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1.5px solid var(--success); }
    .badge-one { background: rgba(250, 204, 21, 0.2); color: var(--accent); border: 1.5px solid var(--accent); }
    .badge-none { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1.5px solid var(--danger); }

    .formula-box {
      background: #030712;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .roots-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
    }

    .chart-wrapper {
      position: relative;
      height: 420px;
      width: 100%;
      background: rgba(3, 7, 18, 0.95);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      cursor: grab;
    }

    .chart-wrapper:active {
      cursor: grabbing;
    }

    .zoom-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Kolom Kiri -->
  <div class="card">
    <div class="header-area">
      <div class="dragon-ball-icon">★</div>
      <h1>QUADRATIC GRAPH SIMULATION</h1>
    </div>
    
    <div class="equation-display" id="equationText">
      f(x) = 1x² + 0x + 0
    </div>

    <!-- Pekali a -->
    <div class="control-row">
      <div class="control-header">
        <label for="numA">Pekali a (Kuasa Parabola):</label>
        <input type="number" id="numA" class="input-num" value="1" step="0.5">
      </div>
      <input type="range" id="rangeA" min="-10" max="10" step="0.5" value="1">
    </div>

    <!-- Pekali b -->
    <div class="control-row">
      <div class="control-header">
        <label for="numB">Pekali b (Sesar Medan Tenaga):</label>
        <input type="number" id="numB" class="input-num" value="0" step="0.5">
      </div>
      <input type="range" id="rangeB" min="-100" max="100" step="1" value="0">
    </div>

    <!-- Pemalar c -->
    <div class="control-row">
      <div class="control-header">
        <label for="numC">Pemalar c (Pintasan-y / Elevasi):</label>
        <input type="number" id="numC" class="input-num" value="0" step="1">
      </div>
      <input type="range" id="rangeC" min="-100" max="100" step="1" value="0">
    </div>

    <!-- Analisis Punca -->
    <div class="result-section">
      <div id="badgeStatus" class="stat-badge badge-two">Pengesan Kuasa Punca</div>
      
      <div class="formula-box">
        <div id="discrimFormula">Δ = b² - 4ac = ...</div>
        <div>Formula: x = (-b ± √Δ) / 2a</div>
      </div>

      <div class="roots-value" id="rootsResult">
        x₁ = 0.00, x₂ = 0.00
      </div>
    </div>
  </div>

  <!-- Kolum Kanan (Graf) -->
  <div class="card">
    <div class="graph-header">
      <h2>Radar Graf Kuadratik</h2>
      <button class="btn-reset-zoom" id="resetZoomBtn">🔄 Reset Skala</button>
    </div>
    <div class="chart-wrapper">
      <canvas id="quadChart"></canvas>
    </div>
    <div class="zoom-hint">
      🔍 <em>Gunakan <strong>Scroll Tetikus</strong> untuk Zoom In/Out | Klik & Tarik untuk gerakkan graf (Pan)</em>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const numA = document.getElementById('numA');
    const rangeA = document.getElementById('rangeA');
    const numB = document.getElementById('numB');
    const rangeB = document.getElementById('rangeB');
    const numC = document.getElementById('numC');
    const rangeC = document.getElementById('rangeC');

    const equationText = document.getElementById('equationText');
    const discrimFormula = document.getElementById('discrimFormula');
    const rootsResult = document.getElementById('rootsResult');
    const badgeStatus = document.getElementById('badgeStatus');
    const resetZoomBtn = document.getElementById('resetZoomBtn');

    const ctx = document.getElementById('quadChart').getContext('2d');
    
    // Inisialisasi Chart.js
    const quadChart = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [
          {
            label: 'Lengkung Parabola f(x)',
            borderColor: '#f97316',
            borderWidth: 3,
            fill: false,
            tension: 0.1,
            pointRadius: 0,
            data: []
          },
          {
            label: 'Titik Bola Naga (Punca / Roots)',
            backgroundColor: '#facc15',
            borderColor: '#ffffff',
            borderWidth: 2,
            pointRadius: 7,
            pointHoverRadius: 10,
            showLine: false,
            data: []
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            type: 'linear',
            position: 'center',
            min: -100,
            max: 100,
            grid: {
              color: (context) => (context.tick && context.tick.value === 0 ? '#ffffff' : 'rgba(234, 88, 12, 0.2)'),
              lineWidth: (context) => (context.tick && context.tick.value === 0 ? 2.5 : 1)
            },
            ticks: { color: '#facc15', font: { weight: 'bold' } }
          },
          y: {
            type: 'linear',
            position: 'center',
            min: -100,
            max: 100,
            grid: {
              color: (context) => (context.tick && context.tick.value === 0 ? '#ffffff' : 'rgba(234, 88, 12, 0.2)'),
              lineWidth: (context) => (context.tick && context.tick.value === 0 ? 2.5 : 1)
            },
            ticks: { color: '#facc15', font: { weight: 'bold' } }
          }
        },
        plugins: {
          legend: {
            labels: { color: '#ffffff', font: { weight: 'bold' } }
          },
          zoom: {
            pan: {
              enabled: true,
              mode: 'xy'
            },
            zoom: {
              wheel: { enabled: true, speed: 0.1 },
              pinch: { enabled: true },
              mode: 'xy'
            }
          }
        }
      }
    });

    // Reset Zoom ke skala asal
    resetZoomBtn.addEventListener('click', () => {
      quadChart.resetZoom();
      quadChart.options.scales.x.min = -100;
      quadChart.options.scales.x.max = 100;
      quadChart.options.scales.y.min = -100;
      quadChart.options.scales.y.max = 100;
      quadChart.update();
    });

    function updateState(source) {
      if (source === 'range') {
        numA.value = rangeA.value;
        numB.value = rangeB.value;
        numC.value = rangeC.value;
      } else {
        rangeA.value = numA.value;
        rangeB.value = numB.value;
        rangeC.value = numC.value;
      }

      let a = parseFloat(numA.value);
      let b = parseFloat(numB.value);
      let c = parseFloat(numC.value);

      if (isNaN(a) || a === 0) a = 0.1;
      if (isNaN(b)) b = 0;
      if (isNaN(c)) c = 0;

      const signB = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
      const signC = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
      equationText.textContent = `f(x) = ${a}x² ${signB}x ${signC}`;

      const delta = (b * b) - (4 * a * c);
      discrimFormula.innerHTML = `Δ = (${b})² - 4(${a})(${c}) = <strong style="color:#facc15">${delta.toFixed(2)}</strong>`;

      let rootPoints = [];

      if (delta > 0.0001) {
        const r1 = (-b + Math.sqrt(delta)) / (2 * a);
        const r2 = (-b - Math.sqrt(delta)) / (2 * a);
        badgeStatus.className = 'stat-badge badge-two';
        badgeStatus.textContent = '⚡ 2 Isyarat Nyata Berbeza ⚡';
        rootsResult.innerHTML = `x₁ = <span style="color:#22c55e">${r1.toFixed(2)}</span>, &nbsp; x₂ = <span style="color:#22c55e">${r2.toFixed(2)}</span>`;
        rootPoints = [{ x: r1, y: 0 }, { x: r2, y: 0 }];
      } else if (Math.abs(delta) <= 0.0001) {
        const r = -b / (2 * a);
        badgeStatus.className = 'stat-badge badge-one';
        badgeStatus.textContent = '🌟 2 Gelombang Nyata Sama 🌟';
        rootsResult.innerHTML = `x = <span style="color:#facc15">${r.toFixed(2)}</span>`;
        rootPoints = [{ x: r, y: 0 }];
      } else {
        const realPart = (-b / (2 * a)).toFixed(2);
        const imagPart = (Math.sqrt(Math.abs(delta)) / (2 * a)).toFixed(2);
        badgeStatus.className = 'stat-badge badge-none';
        badgeStatus.textContent = '🌪️ Tiada Isyarat Nyata (Medan Kompleks) 🌪️';
        rootsResult.innerHTML = `x = ${realPart} ± ${Math.abs(imagPart)}i <br><small style="color:#94a3b8">(Graf terapung, tidak bersilang pada paksi-x)</small>`;
        rootPoints = [];
      }

      // Hitung koordinat parabola dari -150 hingga 150 agar tidak terpotong saat digeser
      const curvePoints = [];
      for (let x = -150; x <= 150; x += 0.5) {
        const y = (a * x * x) + (b * x) + c;
        if (y >= -200 && y <= 200) {
          curvePoints.push({ x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)) });
        }
      }

      quadChart.data.datasets[0].data = curvePoints;
      quadChart.data.datasets[1].data = rootPoints;
      quadChart.update('none');
    }

    [numA, numB, numC].forEach(input => {
      input.addEventListener('input', () => updateState('num'));
    });

    [rangeA, rangeB, rangeC].forEach(slider => {
      slider.addEventListener('input', () => updateState('range'));
    });

    updateState('num');
  });
</script>

</body>
</html>
