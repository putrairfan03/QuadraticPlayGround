<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadraticPlayGround - Dragon Ball Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #ff6600; /* Oren Kamehameha */
      --accent: #facc15; /* Kuning Super Saiyan */
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.85); /* Lutsinar berteknologi radar */
      --border: #ea580c;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Kombat', system-ui, -apple-system, sans-serif;
      /* Latar belakang alam semesta bertarung Dragon Ball */
      background-image: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(3,7,18,0.95) 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 24px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Kad dengan aura ki Saiyan & sempadan berapi */
    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(234, 88, 12, 0.4), inset 0 0 15px rgba(234, 88, 12, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
    }

    /* Tajuk Dragon Ball Style */
    .header-area {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 4px solid var(--accent);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .dragon-ball-icon {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #ffe600 20%, #ff5500 100%);
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ff2200;
      text-shadow: 0 0 3px #ffffff;
      box-shadow: 0 0 15px #ff6600;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 15px #ff6600; }
      50% { transform: scale(1.08); box-shadow: 0 0 25px #ffcc00; }
      100% { transform: scale(1); box-shadow: 0 0 15px #ff6600; }
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #ea580c, 4px 4px 0px #000;
      letter-spacing: 1.5px;
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
      text-shadow: 1px 1px 0px #ea580c, 2px 2px 0px #000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Kotak Persamaan "Ki Aura" */
    .equation-display {
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      padding: 16px;
      background: linear-gradient(90deg, rgba(234,88,12,0.3) 0%, rgba(250,204,21,0.3) 100%);
      border: 3px solid var(--accent);
      border-radius: 12px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(234, 88, 12, 0.3);
    }

    /* Penyelaras Kawalan Slider DBZ */
    .control-row {
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.95);
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .control-header label {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-num {
      width: 80px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 2px solid var(--primary);
      background: #030712;
      color: var(--accent);
      font-weight: 900;
      text-align: center;
      font-size: 1.1rem;
    }

    .input-num:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Hasil Kuasa & Punca */
    .result-section {
      margin-top: 24px;
      border-top: 3px solid var(--border);
      padding-top: 20px;
    }

    .stat-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      margin-bottom: 12px;
      text-transform: uppercase;
      box-shadow: 0 0 12px currentColor;
    }

    .badge-two { background: rgba(34, 197, 94, 0.25); color: var(--success); border: 2px solid var(--success); }
    .badge-one { background: rgba(250, 204, 21, 0.25); color: var(--accent); border: 2px solid var(--accent); }
    .badge-none { background: rgba(239, 68, 68, 0.25); color: var(--danger); border: 2px solid var(--danger); }

    .formula-box {
      background: #030712;
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-top: 10px;
      color: #e2e8f0;
    }

    .roots-value {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-top: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.5);
      border-left: 5px solid var(--accent);
      border-radius: 6px;
    }

    /* Radar Bola Naga (Graf) */
    .chart-wrapper {
      position: relative;
      height: 380px;
      width: 100%;
      background: rgba(3, 7, 18, 0.92);
      border-radius: 14px;
      padding: 12px;
      border: 2px solid var(--border);
    }

    /* Kedudukan Imej Goku di Sudut Halaman */
    .goku-decor {
      position: fixed;
      bottom: -10px;
      right: 10px;
      height: 350px;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(255, 102, 0, 0.5));
      animation: gokuFloat 4s ease-in-out infinite;
    }

    @keyframes gokuFloat {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); filter: drop-shadow(0 0 25px rgba(250, 204, 21, 0.7)); }
      100% { transform: translateY(0) scale(1); }
    }

    @media (max-width: 1280px) {
      .goku-decor {
        height: 250px;
        position: relative;
        bottom: 0;
        right: 0;
        display: block;
        margin: 20px auto 0 auto;
        z-index: 10;
      }
    }
  </style>
</head>
<body>

<div
