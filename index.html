<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksplorasi Persamaan Kuadratik</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 960px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #0f172a;
    }

    .equation-display {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      padding: 14px;
      background: #eff6ff;
      border-radius: 8px;
      color: var(--primary);
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .slider-group {
      margin-bottom: 16px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .info-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .roots-highlight {
      font-weight: 700;
      color: #059669;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Bahagian Kawalan & Teori -->
  <div class="card">
    <h2>Persamaan Kuadratik</h2>
    <div class="equation-display" id="equationText">
      f(x) = 1x² + 0x + 0
    </div>

    <!-- Slider Nilai a -->
    <div class="slider-group">
      <div class="slider-header">
        <label for="valA">Pekali a (Bentuk & Kelebaran):</label>
        <span id="labelA">1</span>
      </div>
      <input type="range" id="valA" min="-5" max="5" step="0.5" value="1">
    </div>

    <!-- Slider Nilai b -->
    <div class="slider-group">
      <div class="slider-header">
        <label for="valB">Pekali b (Kedudukan Paksi Simetri):</label>
        <span id="labelB">0</span>
      </div>
      <input type="range" id="valB" min="-10" max="10" step="0.5" value="0">
    </div>

    <!-- Slider Nilai c -->
    <div class="slider-group">
      <div class="slider-header">
        <label for="valC">Pemalar c (Pintasan-y):</label>
        <span id="labelC">0</span>
      </div>
      <input type="range" id="valC" min="-10" max="10" step="1" value="0">
    </div>

    <!-- Analisis Diskriminan & Punca -->
    <div class="info-box">
      <strong>Analisis Nilai b² - 4ac:</strong>
      <div id="discrimText">Δ = 0</div>
      <div id="rootsText" class="roots-highlight">Dua punca nyata yang sama: x = 0</div>
    </div>
  </div>

  <!-- Bahagian Graf -->
  <div class="card">
    <h2>Graf Kuadratik f(x)</h2>
    <canvas id="quadChart"></canvas>
  </div>
</div>

<script>
  const sliderA = document.getElementById('valA');
  const sliderB = document.getElementById('valB');
  const sliderC = document.getElementById('valC');

  const labelA = document.getElementById('labelA');
  const labelB = document.getElementById('labelB');
  const labelC = document.getElementById('labelC');
  const equationText = document.getElementById('equationText');
  const discrimText = document.getElementById('discrimText');
  const rootsText = document.getElementById('rootsText');

  // Konfigurasi Asas Chart.js
  const ctx = document.getElementById('quadChart').getContext('2d');
  const quadChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'f(x)',
          borderColor: '#2563eb',
          borderWidth: 2.5,
          fill: false,
          pointRadius: 0,
          data: []
        },
        {
          label: 'Punca (Roots)',
          backgroundColor: '#ef4444',
          borderColor: '#ef4444',
          pointRadius: 6,
          showLine: false,
          data: []
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          type: 'linear',
          position: 'center',
          min: -10,
          max: 10,
          grid: { color: '#cbd5e1' }
        },
        y: {
          type: 'linear',
          position: 'center',
          min: -15,
          max: 15,
          grid: { color: '#cbd5e1' }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });

  function updateMath() {
    let a = parseFloat(sliderA.value);
    const b = parseFloat(sliderB.value);
    const c = parseFloat(sliderC.value);

    // Elakkan a = 0 kerana graf bukan lagi parabola kuadratik
    if (a === 0) {
      a = 0.1;
      sliderA.value = 0.1;
    }

    // Kemas kini label antaramuka
    labelA.textContent = a;
    labelB.textContent = b;
    labelC.textContent = c;

    const bSign = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    const cSign = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
    equationText.textContent = `f(x) = ${a}x² ${bSign}x ${cSign}`;

    // Pengiraan Diskriminan: b² - 4ac
    const discriminant = (b * b) - (4 * a * c);
    discrimText.textContent = `b² - 4ac = (${b})² - 4(${a})(${c}) = ${discriminant.toFixed(2)}`;

    // Analisis Punca dan Titik Persilangan Paksi-x
    let rootPoints = [];
    if (discriminant > 0) {
      const r1 = (-b + Math.sqrt(discriminant)) / (2 * a);
      const r2 = (-b - Math.sqrt(discriminant)) / (2 * a);
      rootsText.textContent = `2 Punca Nyata Berbeza: x₁ = ${r1.toFixed(2)}, x₂ = ${r2.toFixed(2)}`;
      rootPoints = [{ x: r1, y: 0 }, { x: r2, y: 0 }];
    } else if (discriminant === 0) {
      const r = -b / (2 * a);
      rootsText.textContent = `2 Punca Nyata Sama: x = ${r.toFixed(2)}`;
      rootPoints = [{ x: r, y: 0 }];
    } else {
      rootsText.textContent = `Tiada Punca Nyata (Graf tidak menyentuh paksi-x)`;
      rootPoints = [];
    }

    // Jana koordinat untuk lengkung parabola
    const curvePoints = [];
    for (let x = -10; x <= 10; x += 0.25) {
      const y = (a * x * x) + (b * x) + c;
      if (y >= -20 && y <= 20) {
        curvePoints.push({ x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)) });
      }
    }

    // Kemas kini dataset dalam graf
    quadChart.data.datasets[0].data = curvePoints;
    quadChart.data.datasets[1].data = rootPoints;
    quadChart.update('none'); // Render laju tanpa animasi berat
  }

  // Sambungkan pendengar peristiwa (event listener)
  sliderA.addEventListener('input', updateMath);
  sliderB.addEventListener('input', updateMath);
  sliderC.addEventListener('input', updateMath);

  // Inisialisasi awal
  updateMath();
</script>

</body>
</html>
