<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadraticPlayGround - Eksplorasi Interaktif</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --danger: #f87171;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1, h2 {
      margin-top: 0;
      color: #ffffff;
    }

    h1 {
      font-size: 1.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .equation-display {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      padding: 14px;
      background: #090d16;
      border: 1px solid var(--primary);
      border-radius: 10px;
      color: var(--accent);
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }

    .control-row {
      margin-bottom: 18px;
      background: #172033;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .control-header label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .input-num {
      width: 75px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
    }

    .input-num:focus {
      outline: 2px solid var(--primary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .result-section {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .stat-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .badge-two { background: rgba(74, 222, 128, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-one { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    .badge-none { background: rgba(248, 113, 113, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .formula-box {
      background: #090d16;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 10px;
      color: #e2e8f0;
    }

    .roots-value {
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffffff;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Kolum Kiri: Kawalan Input & Analisis Punca -->
  <div class="card">
    <h1>QuadraticPlayGround</h1>
    
    <div class="equation-display" id="equationText">
      f(x) = 1x² + 0x + 0
    </div>

    <!-- Pekali a -->
    <div class="control-row">
      <div class="control-header">
        <label for="numA">Pekali a (a ≠ 0):</label>
        <input type="number" id="numA" class="input-num" value="1" step="0.5">
      </div>
      <input type="range" id="rangeA" min="-10" max="10" step="0.5" value="1">
    </div>

    <!-- Pekali b -->
    <div class="control-row">
      <div class="control-header">
        <label for="numB">Pekali b:</label>
        <input type="number" id="numB" class="input-num" value="0" step="0.5">
      </div>
      <input type="range" id="rangeB" min="-20" max="20" step="0.5" value="0">
    </div>

    <!-- Pemalar c -->
    <div class="control-row">
      <div class="control-header">
        <label for="numC">Pemalar c (Pintasan-y):</label>
        <input type="number" id="numC" class="input-num" value="0" step="1">
      </div>
      <input type="range" id="rangeC" min="-20" max="20" step="1" value="0">
    </div>

    <!-- Hasil Analisis Punca & Diskriminan -->
    <div class="result-section">
      <div id="badgeStatus" class="stat-badge badge-two">Analisis Punca</div>
      
      <div class="formula-box">
        <div id="discrimFormula">Δ = b² - 4ac = ...</div>
        <div id="rootFormulaText">x = (-b ± √Δ) / 2a</div>
      </div>

      <div class="roots-value" id="rootsResult">
        x₁ = 0.00, x₂ = 0.00
      </div>
    </div>
  </div>

  <!-- Kolum Kanan: Paparan Graf Realtime -->
  <div class="card">
    <h2>Lengkung Graf Kuadratik</h2>
    <canvas id="quadChart"></canvas>
  </div>
</div>

<script>
  // Elemen input nombor & range slider
  const numA = document.getElementById('numA');
  const rangeA = document.getElementById('rangeA');
  const numB = document.getElementById('numB');
  const rangeB = document.getElementById('rangeB');
  const numC = document.getElementById('numC');
  const rangeC = document.getElementById('rangeC');

  // Elemen teks
  const equationText = document.getElementById('equationText');
  const discrimFormula = document.getElementById('discrimFormula');
  const rootsResult = document.getElementById('rootsResult');
  const badgeStatus = document.getElementById('badgeStatus');

  // Konfigurasi Chart.js
  const ctx = document.getElementById('quadChart').getContext('2d');
  const quadChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Lengkung f(x)',
          borderColor: '#38bdf8',
          borderWidth: 2.5,
          fill: false,
          pointRadius: 0,
          data: []
        },
        {
          label: 'Punca Nyata (Roots)',
          backgroundColor: '#f87171',
          borderColor: '#ffffff',
          borderWidth: 2,
          pointRadius: 7,
          pointHoverRadius: 9,
          showLine: false,
          data: []
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          type: 'linear',
          position: 'center',
          min: -10,
          max: 10,
          grid: { color: '#334155' },
          ticks: { color: '#94a3b8' }
        },
        y: {
          type: 'linear',
          position: 'center',
          min: -15,
          max: 15,
          grid: { color: '#334155' },
          ticks: { color: '#94a3b8' }
        }
      },
      plugins: {
        legend: {
          labels: { color: '#f8fafc' }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return ` (${context.parsed.x.toFixed(2)}, ${context.parsed.y.toFixed(2)})`;
            }
          }
        }
      }
    }
  });

  // Fungsi mengemaskini matematik dan graf
  function updateState(source) {
    let a = parseFloat(numA.value) || 0;
    let b = parseFloat(numB.value) || 0;
    let c = parseFloat(numC.value) || 0;

    // a tidak boleh sifar dalam persamaan kuadratik
    if (a === 0) {
      a = 0.5;
      numA.value = 0.5;
      rangeA.value = 0.5;
    }

    // Selaraskan nilai input teks vs slider
    if (source === 'range') {
      numA.value = rangeA.value;
      numB.value = rangeB.value;
      numC.value = rangeC.value;
      a = parseFloat(numA.value);
      b = parseFloat(numB.value);
      c = parseFloat(numC.value);
    } else {
      rangeA.value = a;
      rangeB.value = b;
      rangeC.value = c;
    }

    // Paparan teks persamaan
    const signB = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    const signC = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
    equationText.textContent = `f(x) = ${a}x² ${signB}x ${signC}`;

    // Pengiraan Diskriminan: Δ = b² - 4ac
    const delta = (b * b) - (4 * a * c);
    discrimFormula.innerHTML = `Δ = (${b})² - 4(${a})(${c}) = <strong>${delta.toFixed(2)}</strong>`;

    let rootPoints = [];

    if (delta > 0) {
      const r1 = (-b + Math.sqrt(delta)) / (2 * a);
      const r2 = (-b - Math.sqrt(delta)) / (2 * a);
      
      badgeStatus.className = 'stat-badge badge-two';
      badgeStatus.textContent = '2 Punca Nyata Berbeza (Δ > 0)';
      rootsResult.innerHTML = `x₁ = <span style="color:#4ade80">${r1.toFixed(3)}</span>, &nbsp; x₂ = <span style="color:#4ade80">${r2.toFixed(3)}</span>`;
      rootPoints = [{ x: r1, y: 0 }, { x: r2, y: 0 }];
    } else if (Math.abs(delta) < 0.0001) {
      const r = -b / (2 * a);
      
      badgeStatus.className = 'stat-badge badge-one';
      badgeStatus.textContent = '2 Punca Nyata Sama / 1 Titik Sentuh (Δ = 0)';
      rootsResult.innerHTML = `x = <span style="color:#38bdf8">${r.toFixed(3)}</span>`;
      rootPoints = [{ x: r, y: 0 }];
    } else {
      const realPart = (-b / (2 * a)).toFixed(2);
      const imagPart = (Math.sqrt(Math.abs(delta)) / (2 * a)).toFixed(2);

      badgeStatus.className = 'stat-badge badge-none';
      badgeStatus.textContent = 'Tiada Punca Nyata (Punca Kompleks, Δ < 0)';
      rootsResult.innerHTML = `x = ${realPart} ± ${Math.abs(imagPart)}i <br><small style="color:#94a3b8">(Graf tidak bersilang pada paksi-x)</small>`;
      rootPoints = [];
    }

    // Kira titik-titik untuk keluk parabola
    const curvePoints = [];
    const minX = Math.min(-10, ...rootPoints.map(p => p.x - 2));
    const maxX = Math.max(10, ...rootPoints.map(p => p.x + 2));

    for (let x = minX; x <= maxX; x += 0.2) {
      const y = (a * x * x) + (b * x) + c;
      if (y >= -50 && y <= 50) {
        curvePoints.push({ x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)) });
      }
    }

    // Kemas kini skala graf mengikut titik pun
